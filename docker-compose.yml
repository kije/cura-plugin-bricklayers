services:
  cura:
    build:
      context: ./docker
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: cura-bricklayers-test
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Software rendering — required in containers without a GPU
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
    volumes:
      # Persistent config volume — Docker manages ownership correctly.
      - cura-data:/config
      # Plugin sources overlaid into the plugin directory (more specific path wins).
      - ./src:/config/.local/share/cura/5.12/plugins/BrickLayers
    ports:
      # KasmVNC browser access — open http://localhost:3000 in any browser.
      - "3000:3000"
      # Raw VNC for mcp-vnc AI agent access
      - "5900:5900"
    restart: unless-stopped

volumes:
  cura-data:
