name: Build BrickLayers Engine Plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugins/BrickLayers/engine_plugin/**'
      - 'plugins/BrickLayers/proto/**'
      - 'plugins/BrickLayers/engine_prototype.py'
      - 'plugins/BrickLayers/tests/**'
      - '.github/workflows/bricklayers-engine.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------
  # Detect which components changed
  # ---------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.filter.outputs.host }}
      wasm: ${{ steps.filter.outputs.wasm }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            host:
              - 'plugins/BrickLayers/engine_plugin/host/**'
              - 'plugins/BrickLayers/proto/**'
              - '.github/workflows/bricklayers-engine.yml'
            wasm:
              - 'plugins/BrickLayers/engine_plugin/wasm/**'
              - 'plugins/BrickLayers/proto/**'
              - '.github/workflows/bricklayers-engine.yml'
            python:
              - 'plugins/BrickLayers/engine_prototype.py'
              - 'plugins/BrickLayers/tests/**'
              - 'plugins/BrickLayers/proto/**'

  # ---------------------------------------------------------------
  # Python prototype tests
  # ---------------------------------------------------------------
  test-python:
    name: Python Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install grpcio grpcio-tools

      - name: Compile proto files
        working-directory: plugins/BrickLayers
        run: |
          python -m grpc_tools.protoc \
            --proto_path=proto \
            --python_out=proto \
            --grpc_python_out=proto \
            proto/cura/plugins/v0/slot_id.proto \
            proto/cura/plugins/v0/point3d.proto \
            proto/cura/plugins/v0/printfeatures.proto \
            proto/cura/plugins/v0/polygons.proto \
            proto/cura/plugins/v0/gcode_path.proto \
            proto/cura/plugins/slots/handshake/v0/handshake.proto \
            proto/cura/plugins/slots/broadcast/v0/broadcast.proto \
            proto/cura/plugins/slots/gcode_paths/v0/modify.proto

      - name: Run tests
        working-directory: plugins/BrickLayers
        run: python -m unittest tests.TestBrickLayers -v

  # ---------------------------------------------------------------
  # WASM algorithm module (universal, single platform)
  # ---------------------------------------------------------------
  build-wasm:
    name: Build WASM
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/BrickLayers/engine_plugin
          key: wasm

      - name: Build WASM module
        working-directory: plugins/BrickLayers/engine_plugin
        run: cargo build -p bricklayers_wasm --target wasm32-wasip1 --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: bricklayers-wasm
          path: plugins/BrickLayers/engine_plugin/target/wasm32-wasip1/release/bricklayers_wasm.wasm
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Native host binary (per-platform)
  # ---------------------------------------------------------------
  build-host:
    name: Build Host (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: bricklayers_engine
            artifact_name: bricklayers_engine-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: bricklayers_engine
            artifact_name: bricklayers_engine-linux-aarch64
            cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: bricklayers_engine.exe
            artifact_name: bricklayers_engine-windows-x86_64

          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: bricklayers_engine
            artifact_name: bricklayers_engine-macos-x86_64
            cross: true

          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: bricklayers_engine
            artifact_name: bricklayers_engine-macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/BrickLayers/engine_plugin
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure cross-compilation linker
        if: matrix.cross && runner.os == 'Linux'
        run: |
          mkdir -p plugins/BrickLayers/engine_plugin/.cargo
          cat > plugins/BrickLayers/engine_plugin/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build native host
        working-directory: plugins/BrickLayers/engine_plugin
        run: cargo build -p bricklayers_engine --release --target ${{ matrix.target }}

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: plugins/BrickLayers/engine_plugin/target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Package — assemble plugin, reusing previous artifacts if skipped
  # ---------------------------------------------------------------
  package:
    name: Package Plugin
    needs: [build-wasm, build-host]
    if: |
      always() &&
      (needs.build-wasm.result == 'success' || needs.build-wasm.result == 'skipped') &&
      (needs.build-host.result == 'success' || needs.build-host.result == 'skipped') &&
      (needs.build-wasm.result == 'success' || needs.build-host.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Download artifacts built in THIS run
      - name: Download current run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
        continue-on-error: true

      # For skipped builds, fetch from the last successful run
      - name: Fetch previous WASM artifact
        if: needs.build-wasm.result == 'skipped'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: bricklayers-engine.yml
          name: bricklayers-wasm
          path: artifacts/bricklayers-wasm
          branch: main
          if_no_artifact_found: warn
          workflow_conclusion: success

      - name: Fetch previous host binaries
        if: needs.build-host.result == 'skipped'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: bricklayers-engine.yml
          name: bricklayers_engine-*
          name_is_regexp: true
          path: artifacts/
          branch: main
          if_no_artifact_found: warn
          workflow_conclusion: success

      - name: Assemble plugin package
        run: |
          PKG="bricklayers-plugin"
          mkdir -p "$PKG/BrickLayers/bin/linux-x86_64"
          mkdir -p "$PKG/BrickLayers/bin/linux-aarch64"
          mkdir -p "$PKG/BrickLayers/bin/windows-x86_64"
          mkdir -p "$PKG/BrickLayers/bin/macos-x86_64"
          mkdir -p "$PKG/BrickLayers/bin/macos-aarch64"

          # Copy plugin Python files
          cp plugins/BrickLayers/plugin.json              "$PKG/BrickLayers/"
          cp plugins/BrickLayers/__init__.py               "$PKG/BrickLayers/"
          cp plugins/BrickLayers/BrickLayers.py            "$PKG/BrickLayers/"
          cp plugins/BrickLayers/BrickLayersEnginePlugin.py "$PKG/BrickLayers/"
          cp plugins/BrickLayers/engine_prototype.py       "$PKG/BrickLayers/"
          cp plugins/BrickLayers/brick_layers_settings.def.json "$PKG/BrickLayers/"
          cp -r plugins/BrickLayers/proto                  "$PKG/BrickLayers/"

          # Copy QML files if present
          cp plugins/BrickLayers/*.qml "$PKG/BrickLayers/" 2>/dev/null || true

          # Copy platform host binaries (from this run or previous)
          for plat in linux-x86_64 linux-aarch64 windows-x86_64 macos-x86_64 macos-aarch64; do
            artifact_dir="artifacts/bricklayers_engine-${plat}"
            if [ -d "$artifact_dir" ]; then
              cp "$artifact_dir"/* "$PKG/BrickLayers/bin/${plat}/"
            else
              echo "WARNING: No host binary for ${plat}"
            fi
          done

          # Copy universal WASM module into each platform bin directory
          if [ -f artifacts/bricklayers-wasm/bricklayers_wasm.wasm ]; then
            for dir in "$PKG/BrickLayers/bin/"*/; do
              cp artifacts/bricklayers-wasm/bricklayers_wasm.wasm "$dir/bricklayers.wasm"
            done
          else
            echo "WARNING: No WASM module found"
          fi

          # Make binaries executable
          chmod +x "$PKG/BrickLayers/bin/"*/bricklayers_engine* 2>/dev/null || true

          # Create zip package
          cd "$PKG"
          zip -r "../BrickLayers-plugin.zip" BrickLayers/
          cd ..

          echo "=== Package contents ==="
          unzip -l BrickLayers-plugin.zip

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: BrickLayers-plugin
          path: BrickLayers-plugin.zip
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Release — create GitHub release on tag push
  # ---------------------------------------------------------------
  release:
    name: Create Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: BrickLayers-plugin

      - name: Download individual binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            BrickLayers-plugin.zip
            binaries/bricklayers_engine-linux-x86_64/bricklayers_engine
            binaries/bricklayers_engine-linux-aarch64/bricklayers_engine
            binaries/bricklayers_engine-windows-x86_64/bricklayers_engine.exe
            binaries/bricklayers_engine-macos-x86_64/bricklayers_engine
            binaries/bricklayers_engine-macos-aarch64/bricklayers_engine
