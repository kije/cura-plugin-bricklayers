name: Build BrickLayers Engine Plugin

on:
  push:
    paths:
      - 'plugins/BrickLayers/engine_plugin/**'
      - 'plugins/BrickLayers/proto/**'
      - '.github/workflows/bricklayers-engine.yml'
  pull_request:
    paths:
      - 'plugins/BrickLayers/engine_plugin/**'
      - 'plugins/BrickLayers/proto/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: bricklayers_engine
            artifact_name: bricklayers_engine-linux-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: bricklayers_engine.exe
            artifact_name: bricklayers_engine-windows-x86_64
          - target: x86_64-apple-darwin
            os: macos-13
            binary_name: bricklayers_engine
            artifact_name: bricklayers_engine-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            binary_name: bricklayers_engine
            artifact_name: bricklayers_engine-macos-aarch64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Build
        working-directory: plugins/BrickLayers/engine_plugin
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: plugins/BrickLayers/engine_plugin/target/${{ matrix.target }}/release/${{ matrix.binary_name }}

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bricklayers_engine-linux-x86_64/bricklayers_engine
            bricklayers_engine-windows-x86_64/bricklayers_engine.exe
            bricklayers_engine-macos-x86_64/bricklayers_engine
            bricklayers_engine-macos-aarch64/bricklayers_engine
